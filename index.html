<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Quest</title>
<meta name="description" content="A checklist of 244 skills you can genuinely learn in a few sessions to a few weeks. Track what you've learned, build a wishlist, saved right in your browser.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127919;</text></svg>">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span class="brand-text">Skill<em>Quest</em></span>
    </a>

    <form class="searchbox" role="search" onsubmit="return false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search all skills…" autocomplete="off" aria-label="Search skills">
      <kbd>/</kbd>
    </form>

    <nav class="topnav">
      <a href="#/wishlist" data-nav="wishlist">Wishlist <span class="pill" id="nav-wish">0</span></a>
      <a href="#/learned" data-nav="learned">Learned <span class="pill" id="nav-done">0</span></a>
      <a href="#/passed" data-nav="passed">Passed <span class="pill" id="nav-pass">0</span></a>
      <button id="theme-toggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>
    </nav>
  </div>
  <div class="topprogress"><i id="topprogress-bar"></i></div>
</header>

<main id="main" class="wrap"></main>

<footer class="foot wrap">
  <p>Everything you tick is stored only in this browser's local storage — nothing is uploaded anywhere.</p>
  <p class="foot-actions">
    <button class="linky" id="export-btn">Export my progress</button>
    <button class="linky" id="import-btn">Import a backup</button>
    <button class="linky danger" id="reset-btn">Reset everything</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  </p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/categories.js"></script>
<script src="js/data/puzzles.js"></script>
<script src="js/data/dexterity.js"></script>
<script src="js/data/outdoors.js"></script>
<script src="js/data/physical.js"></script>
<script src="js/data/music.js"></script>
<script src="js/data/making.js"></script>
<script src="js/data/cooking.js"></script>
<script src="js/data/social.js"></script>
<script src="js/data/observation.js"></script>
<script src="js/data/creative.js"></script>
<script src="js/data/technology.js"></script>
<script src="js/data/navigation.js"></script>
<script src="js/data/precision.js"></script>
<script src="js/data/oldschool.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
